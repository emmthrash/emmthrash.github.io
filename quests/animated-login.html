<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="quest.css"><title>Animated login | Side quest</title></head><body>
<header class="quest-bar"><a href="../index.html#quests">Back to portfolio</a><span>Side quest: Animated login</span></header>
<main class="stage"><h1>Animated login</h1>
<p>A glowing log in card with floating labels. It is a UI demo: nothing is sent or saved.</p>
<div class="auth one"><form class="panel" id="f"><h2>Log in</h2>
<div class="field"><input id="e" type="email" placeholder=" " autocomplete="email" required><label for="e">Email</label></div>
<div class="field"><input id="w" type="password" placeholder=" " autocomplete="current-password" required><label for="w">Password</label><button class="peek" type="button" aria-label="Show password">Show</button></div>
<button class="button primary">Log in</button>
<p class="switch">New here? <a href="create-account.html">Create an account</a></p></form></div>
<p class="msg" id="msg" role="status"></p></main>
<script>
const f=document.getElementById("f"),w=document.getElementById("w"),pk=f.querySelector(".peek"),m=document.getElementById("msg");
pk.onclick=()=>{const s=w.type==="password";w.type=s?"text":"password";pk.textContent=s?"Hide":"Show"};
f.onsubmit=e=>{e.preventDefault();m.textContent="Looks good. This is a demo, so nothing was sent.";f.reset()};
</script>
</body></html>
